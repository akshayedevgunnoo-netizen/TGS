<body><div class="app"><aside class="sidebar"><div class="brand"><div class="brandmark">T</div><div class="brandname">TGS <span style="color:var(--orange)">CLARK & ROBBINS</span><small>PRACTICE HUB</small></div></div><div class="navlabel">Workspace</div><nav class="nav" id="nav"><button class="active" data-page="dashboard"><span class="ico">▦</span><span>Dashboard</span></button><button data-page="clients"><span class="ico">◫</span><span>Clients</span><i class="nav-count" id="clientCount">0</i></button><button data-page="planner"><span class="ico">▤</span><span>Work planner</span></button><button data-page="compliance"><span class="ico">◈</span><span>KYC & compliance</span><i class="nav-count" id="kycCount">0</i></button><button data-page="team"><span class="ico">♧</span><span>Team</span></button></nav><div class="sidebar-bottom"><div class="side-card"><b>Good practice starts here.</b>Keep client work, responsibilities and compliance evidence together.</div><div class="profile"><div class="avatar" id="profileInitials">PA</div><div><b id="profileName">Loading workspace…</b><small id="profileRole">Checking access</small></div></div></div></aside><main class="main"><header class="topbar"><div class="crumb">TGS Practice Hub <span style="padding:0 7px;color:#ccc">/</span> <b id="crumb">Dashboard</b></div><div class="top-actions"><div class="search"><input id="globalSearch" placeholder="Search clients or work…"></div><a class="btn" href="/signout-with-chatgpt?return_to=/" target="_top" style="padding:8px 10px">Sign out</a><div class="avatar" id="topInitials" style="width:32px;height:32px">PA</div></div></header><div class="content" id="view"></div></main></div><div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
let state={user:null,clients:[],work:[],archivedWork:[],members:[],invites:[],documents:{},due:[]};
let current='dashboard',query='',selectedClient=null,clientStatus='All statuses',workStatus='All statuses',workView='active';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=s=>String(s||'').split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();
const tag=(t,c='')=>`<span class="tag ${c}">${esc(t)}</span>`;
const statusTag=s=>tag(s,s==='Completed'?'green':s==='In progress'?'blue':s==='Under review'?'yellow':s==='Lack of information'?'red':'');
const privileged=()=>['managing_partner','partner','manager'].includes(state.user?.role);
const canManage=()=>privileged();
const roleLabel=r=>({managing_partner:'Managing partner',partner:'Partner',manager:'Manager',staff:'Staff'}[r]||r);
const button=(text,onclick,kind='')=>`<button class="btn ${kind}" onclick="${onclick}">${text}</button>`;
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),3000)}
async function api(path,opts={}){let r=await fetch(path,{...opts,headers:{...(opts.body instanceof FormData?{}:{'content-type':'application/json'}),...(opts.headers||{})}});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||'Request failed.');return data}
async function load(){try{state=await api('/api/init');document.getElementById('profileName').textContent=state.user.display_name;document.getElementById('profileRole').textContent=roleLabel(state.user.role);document.getElementById('profileInitials').textContent=initials(state.user.display_name);document.getElementById('topInitials').textContent=initials(state.user.display_name);document.getElementById('clientCount').textContent=state.clients.length;document.getElementById('kycCount').textContent=state.due.length;render()}catch(e){document.getElementById('view').innerHTML=`<div class="card" style="max-width:650px;margin:50px auto;padding:32px"><p class="eyebrow">Workspace access</p><h1 style="font:800 22px Manrope;margin:0 0 12px">TGS Practice Hub</h1><p style="color:#737780;line-height:1.7">${esc(e.message)}</p><p style="color:#92959b;font-size:11px">This workspace is restricted to approved firm accounts. If you believe you should have access, contact the managing partner.</p><a class="btn primary" href="/signin-with-chatgpt?return_to=/" target="_top">Sign in with ChatGPT</a></div>`}}
const title=(h,s,btn='')=>`<div class="pagehead"><div><p class="eyebrow">Practice workspace</p><h1>${h}</h1><div class="sub">${s}</div></div>${btn}</div>`;
function render(){document.getElementById('crumb').textContent={dashboard:'Dashboard',clients:'Clients',planner:'Work planner',compliance:'KYC & compliance',team:'Team'}[current];document.getElementById('clientCount').textContent=state.clients.length;document.getElementById('kycCount').textContent=state.due.length;document.getElementById('view').innerHTML={dashboard:dashboard,clients:clientPage,planner:planner,compliance:compliance,team:teamPage}[current]();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===current));}
function go(p){current=p;query='';render()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
document.getElementById('globalSearch').addEventListener('input',e=>{query=e.target.value;if(current==='dashboard')current='clients';render()});
function dashboard(){const due=state.work.filter(w=>w.status!=='Completed').slice(0,5),hours=state.work.reduce((n,w)=>n+Number(w.budget_hours||0),0),open=state.work.filter(w=>w.status!=='Completed').length;return `<div class="welcome"><div><p class="eyebrow">Your practice at a glance</p><h1>Welcome, ${esc(state.user.display_name.split(' ')[0])}</h1><div class="sub">Client work, deadlines and compliance actions for your team.</div></div>${canManage()?button('＋ Plan new work','openWork()','primary'):''}</div><div class="stats"><div class="stat"><div class="stathead">Active clients <span class="staticon">◫</span></div><div class="statnum">${state.clients.length}</div><div class="statnote">In your permitted portfolio</div></div><div class="stat"><div class="stathead">Open engagements <span class="staticon">▤</span></div><div class="statnum">${open}</div><div class="statnote">Assigned or under review</div></div><div class="stat"><div class="stathead">Budgeted hours <span class="staticon">◷</span></div><div class="statnum">${hours}<span style="font-size:13px;color:#92959b;font-weight:500"> hrs</span></div><div class="statnote">Across current engagements</div></div><div class="stat"><div class="stathead">Compliance to review <span class="staticon">◈</span></div><div class="statnum">${state.due.length}</div><div class="statnote">KYC reviews not marked complete</div></div></div><div class="dashgrid"><section class="card"><div class="cardhead"><div><h2>Upcoming deadlines</h2><p>Open work, ordered by delivery date</p></div><button class="textlink" onclick="go('planner')">View planner →</button></div><div class="tasklist">${due.length?due.map(w=>`<div class="task"><i class="taskpin"></i><div><b>${esc(w.company)}</b><small>${esc(w.nature)} · ${esc(w.staff_name||w.staff_email)}</small></div><span class="duedate">${esc(w.delivery_date||'Not set')}</span></div>`).join(''):'<div class="empty">No open engagements yet. Add a client and plan your first assignment.</div>'}</div></section><section class="card"><div class="cardhead"><div><h2>KYC queue</h2><p>Clients requiring attention</p></div><button class="textlink" onclick="go('compliance')">Open queue →</button></div><div>${state.due.slice(0,5).map(k=>`<div class="compliance-item"><span class="comp-ico">◈</span><span class="comp-detail"><b>${esc(k.legal_name)}</b><small>${esc(k.status)} · ${esc(k.review_due||'Review date not set')}</small></span>${tag(k.risk_rating,k.risk_rating==='High'?'red':'yellow')}</div>`).join('')||'<div class="empty">No KYC reviews are currently outstanding.</div>'}</div></section></div><div class="lowergrid"><section class="card"><div class="cardhead"><div><h2>Work distribution</h2><p>Current engagements by delivery status</p></div><button class="textlink" onclick="go('planner')">Open planner →</button></div><div class="tasklist">${state.work.slice(0,5).map(w=>`<div class="task"><i class="taskpin ${w.status==='Completed'?'green':''}"></i><div><b>${esc(w.company)} · ${esc(w.nature)}</b><small>${esc(w.staff_name||w.staff_email)} · ${Number(w.budget_hours||0)} budgeted hours</small></div>${statusTag(w.status)}</div>`).join('')||'<div class="empty">Your assignments will appear here.</div>'}</div></section><section class="card"><div class="cardhead"><div><h2>Firm workspace</h2><p>Access is managed by role</p></div></div><div class="compliance-item"><span class="comp-ico">♧</span><span class="comp-detail"><b>${state.members.length} active members</b><small>Partners, managers and staff</small></span></div><div class="compliance-item"><span class="comp-ico">▣</span><span class="comp-detail"><b>Protected KYC documents</b><small>Access is checked for each request</small></span></div></section></div>`}
function clientPage(){let rows=state.clients.filter(c=>(clientStatus==='All statuses'||c.status===clientStatus)&&(c.legal_name+' '+c.registration_no+' '+c.sector+' '+c.contact_name).toLowerCase().includes(query.toLowerCase()));return `${title('Clients','Open a client record to view or edit the information entered at registration.',canManage()?button('＋ Add client','openClient()','primary'):'')}<div class="toolbar"><input class="filter-input" placeholder="⌕  Search clients…" value="${esc(query)}" oninput="query=this.value;render()"><select class="select" onchange="filterClients(this.value)"><option ${clientStatus==='All statuses'?'selected':''}>All statuses</option><option ${clientStatus==='Active'?'selected':''}>Active</option><option ${clientStatus==='Onboarding'?'selected':''}>Onboarding</option><option ${clientStatus==='Inactive'?'selected':''}>Inactive</option></select><select class="select"><option>All partner portfolios</option>${state.members.filter(m=>['partner','managing_partner'].includes(m.role)).map(m=>`<option>${esc(m.display_name)}</option>`).join('')}</select></div><div class="tablecard"><div class="tableinfo"><span><b style="color:#313238">${rows.length} clients</b> shown</span><span>Shared firm database</span></div><table class="table"><thead><tr><th>Client</th><th>Sector</th><th>Relationship partner</th><th>KYC status</th><th>Risk</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(c=>`<tr><td><div class="clientname"><span class="clientbadge">${initials(c.legal_name)}</span><span><b style="cursor:pointer" title="View client details" onclick="showClient('${c.id}')">${esc(c.legal_name)}</b><small>${esc(c.registration_no||'Registration number not recorded')}</small></span></div></td><td>${esc(c.sector||'—')}</td><td>${esc(displayEmail(c.partner_email))}</td><td>${tag(c.kyc_status,c.kyc_status==='Complete'?'green':c.kyc_status==='Enhanced review'?'red':'yellow')}</td><td>${tag(c.risk_rating,c.risk_rating==='Low'?'green':c.risk_rating==='High'?'red':'yellow')}</td><td>${tag(c.status,c.status==='Inactive'?'red':c.status==='Onboarding'?'blue':'green')}</td><td><div style="display:flex;gap:12px;white-space:nowrap"><button class="textlink" onclick="showClient('${c.id}')">View details</button>${canManage()?`<button class="textlink" onclick="openClientEdit('${c.id}')">Edit</button>`:''}</div></td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">No client records yet. Add the first client to start building the shared database.</div>'}</div>`}
function displayEmail(email){return state.members.find(m=>m.email.toLowerCase()===String(email||'').toLowerCase())?.display_name||email||'—'}
function filterClients(v){clientStatus=v;render()}
function showClient(clientId){const c=state.clients.find(x=>x.id===clientId);if(!c)return;const value=(label,v)=>`<div class="field"><label>${label}</label><div style="padding:9px 1px;color:#303137;font-size:12px;line-height:1.5;overflow-wrap:anywhere">${esc(v||'Not recorded')}</div></div>`;const created=c.created_at?new Date(String(c.created_at).replace(' ','T')+'Z').toLocaleString():'';document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><section class="modal" style="width:min(760px,100%)"><div class="modalhead"><div><p class="eyebrow" style="margin:0 0 6px">Client record</p><h2>${esc(c.legal_name)}</h2><p>${esc(c.registration_no||'Registration number not recorded')} · ${esc(c.status)}</p></div><button class="close" onclick="closeModal()">×</button></div><div class="formgrid">${value('Legal name',c.legal_name)}${value('Registration number',c.registration_no)}${value('Sector / activity',c.sector)}${value('Relationship partner',displayEmail(c.partner_email))}${value('Primary contact',c.contact_name)}${value('Contact email',c.contact_email)}${value('Telephone',c.contact_phone)}${value('Client status',c.status)}<div class="field wide">${value('Registered / business address',c.address)}</div>${value('KYC review status',c.kyc_status)}${value('Risk rating',c.risk_rating)}${value('Next review date',c.review_due)}${value('Record created',created)}${value('Created by',displayEmail(c.created_by))}</div><div class="modalfoot" style="justify-content:space-between"><button class="btn" onclick="closeModal()">Close</button><div style="display:flex;gap:8px"><button class="btn" onclick="openKyc('${c.id}')">KYC & documents</button>${canManage()?`<button class="btn primary" onclick="openClientEdit('${c.id}')">Edit client information</button>`:''}</div></div></section></div>`}
function jobActions(w){if(workView==='archived')return canManage()?`<button class="textlink" onclick="restoreJob('${w.id}')">Restore</button>`:'';return `<button class="textlink" onclick="updateProgress('${w.id}')">Update</button>${canManage()?`<button class="textlink" style="color:#b64242" onclick="deleteJob('${w.id}')">Delete</button>`:''}`}
function planner(){
  const source=workView==='archived'?state.archivedWork:state.work;
  const rows=source.filter(w=>(workStatus==='All statuses'||w.status===workStatus)&&(w.company+' '+w.nature+' '+(w.staff_name||'')+' '+(w.reviewer_name||'')).toLowerCase().includes(query.toLowerCase()));
  const label=workView==='archived'?'Archived jobs':'Active jobs';
  const statusOptions=['Not started','Lack of information','In progress','Under review','Completed'].map(s=>`<option ${workStatus===s?'selected':''}>${s}</option>`).join('');
  const viewFilter=canManage()?`<select class="select" onchange="setWorkView(this.value)"><option value="active" ${workView==='active'?'selected':''}>Active jobs</option><option value="archived" ${workView==='archived'?'selected':''}>Archived jobs</option></select>`:'';
  const emptyText=workView==='archived'?'No archived jobs.':'No engagements planned yet.';
  return `${title('Work planner','Plan assignments, review responsibilities, partner oversight and delivery dates.',canManage()&&workView==='active'?button('＋ Plan new work','openWork()','primary'):'')}
  <div class="workcards"><div class="mini-stat"><small>Open work</small><b>${state.work.filter(w=>w.status!=='Completed').length} <span class="muted" style="font:500 10px 'DM Sans'">engagements</span></b></div><div class="mini-stat"><small>Budgeted hours</small><b>${state.work.reduce((n,w)=>n+Number(w.budget_hours||0),0)} <span class="muted" style="font:500 10px 'DM Sans'">hours</span></b></div><div class="mini-stat"><small>Due dates entered</small><b>${state.work.filter(w=>w.delivery_date).length} <span class="muted" style="font:500 10px 'DM Sans'">deliverables</span></b></div></div>
  <div class="toolbar"><input class="filter-input" placeholder="⌕  Search assignments…" value="${esc(query)}" oninput="query=this.value;render()"><select class="select" onchange="filterWork(this.value)"><option ${workStatus==='All statuses'?'selected':''}>All statuses</option>${statusOptions}</select>${viewFilter}</div>
  <div class="tablecard planner-table"><div class="tableinfo"><span><b style="color:#313238">${rows.length} ${label.toLowerCase()}</b></span><span>Shared practice planner</span></div><table class="table"><thead><tr><th>Client & engagement</th><th>Assigned staff</th><th>Reviewer</th><th>Partner</th><th>Delivery</th><th>Budget</th><th>Progress</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(w=>`<tr><td><span class="cell-main">${esc(w.company)}</span><small style="display:block;margin-top:4px;color:#95979e">${esc(w.nature)}</small></td><td>${esc(w.staff_name||w.staff_email)}</td><td>${esc(w.reviewer_name||w.reviewer_email)}</td><td>${esc(w.partner_name||w.partner_email)}</td><td>${esc(w.delivery_date||'Not set')}</td><td><span class="cell-main">${Number(w.budget_hours||0)}h</span></td><td><i class="progress"><i style="width:${Math.max(0,Math.min(100,Number(w.progress||0)))}%"></i></i><span class="muted">${Number(w.progress||0)}%</span></td><td>${statusTag(w.status)}</td><td><div style="display:flex;gap:10px;white-space:nowrap">${jobActions(w)}</div></td></tr>`).join('')}</tbody></table>${rows.length?'':`<div class="empty">${emptyText}</div>`}</div>`
}
function setWorkView(v){workView=v==='archived'&&canManage()?'archived':'active';workStatus='All statuses';render()}
function filterWork(v){workStatus=v;render()}
function compliance(){return `${title('KYC & compliance','Due diligence, document records and review history.')}<div class="compliance-layout"><section class="card"><div class="cardhead"><div><h2>Review queue</h2><p>${state.due.length} client reviews not marked complete</p></div></div><div class="tablecard" style="border-radius:9px"><table class="table"><thead><tr><th>Client</th><th>Review status</th><th>Risk</th><th>Review due</th><th>Documents</th><th></th></tr></thead><tbody>${state.clients.map(c=>`<tr><td><div class="client-row"><span class="clientbadge">${initials(c.legal_name)}</span><span><span class="cell-main">${esc(c.legal_name)}</span><small style="display:block;color:#9a9ca2;margin-top:3px">${esc(c.registration_no||'')}</small></span></div></td><td>${tag(c.kyc_status,c.kyc_status==='Complete'?'green':c.kyc_status==='Enhanced review'?'red':'yellow')}</td><td>${tag(c.risk_rating,c.risk_rating==='High'?'red':c.risk_rating==='Low'?'green':'yellow')}</td><td>${esc(c.review_due||'Not set')}</td><td>${Number(state.documents[c.id]||0)} file(s)</td><td><button class="textlink" onclick="openKyc('${c.id}')">Review →</button></td></tr>`).join('')}</tbody></table>${state.clients.length?'':'<div class="empty">Add client records to start their KYC files.</div>'}</div></section><section class="card"><div class="cardhead"><div><h2>Compliance reminders</h2><p>Keep review dates current</p></div></div><div class="checklist"><div class="checkrow"><span class="check pending">!</span><span><b>Review beneficial owners</b><small>Record identities and ownership structure</small></span></div><div class="checkrow"><span class="check pending">!</span><span><b>Assess client risk</b><small>Set risk rating and review frequency</small></span></div><div class="checkrow"><span class="check pending">!</span><span><b>Document approval</b><small>Keep reviewer and partner sign-off notes</small></span></div></div><div class="risk"><b>Access and audit:</b> Client documents are stored in private object storage. Each view, upload and review is checked against your workspace role and recorded.</div></section></div>`}
function teamPage(){return `${title('Team','Manage workspace members and their assigned roles.',state.user.role==='managing_partner'?button('＋ Invite member','openInvite()','primary'):'')}<div class="workcards"><div class="mini-stat"><small>Active members</small><b>${state.members.length}</b></div><div class="mini-stat"><small>Pending invitations</small><b>${state.invites.length}</b></div><div class="mini-stat"><small>Current access</small><b>${esc(roleLabel(state.user.role))}</b></div></div><div class="teamgrid">${state.members.map(m=>`<div class="member"><div class="membertop"><div class="avatar">${initials(m.display_name)}</div><div><b>${esc(m.display_name)}</b><small>${esc(roleLabel(m.role))}</small></div></div><div class="memberload"><span>${esc(m.email)}</span><b>${m.active?'Active':'Disabled'}</b></div></div>`).join('')}${state.invites.map(i=>`<div class="member"><div class="membertop"><div class="avatar" style="background:#fff0e9;color:#a24c25">＋</div><div><b>${esc(i.display_name)}</b><small>Invitation · ${esc(roleLabel(i.role))}</small></div></div><div class="memberload"><span>${esc(i.email)}</span><button class="textlink" onclick="cancelInvite('${encodeURIComponent(i.email)}')">Cancel</button></div></div>`).join('')}</div><div class="risk" style="margin-top:18px"><b>Staff sign-in:</b> Members sign in with their approved ChatGPT account. The managing partner also needs to add their email to the Site access list before they can enter the workspace.</div>`}
function modal(title,sub,body,submit,label){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modalhead"><div><h2>${title}</h2><p>${sub}</p></div><button class="close" onclick="closeModal()">×</button></div>${body}<div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="${submit}">${label}</button></div></section></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function memberOptions(filter){return state.members.filter(m=>m.active&&(!filter||filter.includes(m.role))).map(m=>`<option value="${esc(m.email)}">${esc(m.display_name)} · ${esc(m.email)}</option>`).join('')}
function openClient(){modal('Add a client','Create a firm client record.',`<div class="formgrid"><div class="field wide"><label>Legal name</label><input id="cname" placeholder="Company or organisation legal name"></div><div class="field"><label>Registration number</label><input id="creg"></div><div class="field"><label>Sector</label><input id="csector" placeholder="Industry or activity"></div><div class="field"><label>Relationship partner</label><select id="cpartner">${memberOptions(['partner','managing_partner'])}</select></div><div class="field"><label>Primary contact</label><input id="ccontact"></div><div class="field"><label>Contact email</label><input id="cemail" type="email"></div><div class="field"><label>Telephone</label><input id="cphone"></div><div class="field wide"><label>Registered / business address</label><textarea id="caddress" rows="2"></textarea></div></div>`,'saveClient()','Create client')}
function openClientEdit(clientId){const c=state.clients.find(x=>x.id===clientId);if(!c)return;const partnerOptions=state.members.filter(m=>['partner','managing_partner'].includes(m.role)&&m.active).map(m=>`<option value="${esc(m.email)}" ${m.email.toLowerCase()===String(c.partner_email).toLowerCase()?'selected':''}>${esc(m.display_name)} · ${esc(m.email)}</option>`).join('');modal('Edit client information','Update the registration details saved for this client.',`<div class="formgrid"><div class="field wide"><label>Legal name</label><input id="cname" value="${esc(c.legal_name)}"></div><div class="field"><label>Registration number</label><input id="creg" value="${esc(c.registration_no)}"></div><div class="field"><label>Sector</label><input id="csector" value="${esc(c.sector)}"></div><div class="field"><label>Relationship partner</label><select id="cpartner">${partnerOptions}</select></div><div class="field"><label>Primary contact</label><input id="ccontact" value="${esc(c.contact_name)}"></div><div class="field"><label>Contact email</label><input id="cemail" type="email" value="${esc(c.contact_email)}"></div><div class="field"><label>Telephone</label><input id="cphone" value="${esc(c.contact_phone)}"></div><div class="field"><label>Status</label><select id="cstatus">${['Active','Onboarding','Inactive'].map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field wide"><label>Registered / business address</label><textarea id="caddress" rows="2">${esc(c.address)}</textarea></div></div>`,'saveClientEdit(\''+clientId+'\')','Save changes')}
async function saveClientEdit(clientId){try{await api('/api/clients/'+encodeURIComponent(clientId),{method:'PATCH',body:JSON.stringify({legal_name:document.getElementById('cname').value,registration_no:document.getElementById('creg').value,sector:document.getElementById('csector').value,partner_email:document.getElementById('cpartner').value,contact_name:document.getElementById('ccontact').value,contact_email:document.getElementById('cemail').value,contact_phone:document.getElementById('cphone').value,address:document.getElementById('caddress').value,status:document.getElementById('cstatus').value})});closeModal();await load();showClient(clientId);toast('Client information updated in the shared database.')}catch(e){toast(e.message)}}
async function saveClient(){try{await api('/api/clients',{method:'POST',body:JSON.stringify({legal_name:document.getElementById('cname').value,registration_no:document.getElementById('creg').value,sector:document.getElementById('csector').value,partner_email:document.getElementById('cpartner').value,contact_name:document.getElementById('ccontact').value,contact_email:document.getElementById('cemail').value,contact_phone:document.getElementById('cphone').value,address:document.getElementById('caddress').value})});closeModal();await load();go('clients');toast('Client record saved to the shared database.')}catch(e){toast(e.message)}}
function openWork(){if(!state.clients.length){toast('Add a client before planning work.');return}modal('Plan new work','Assign delivery, reviewer and partner ownership.',`<div class="formgrid"><div class="field wide"><label>Client</label><select id="wclient">${state.clients.map(c=>`<option value="${esc(c.id)}">${esc(c.legal_name)}</option>`).join('')}</select></div><div class="field wide"><label>Nature of work</label><input id="wnature" placeholder="Annual audit, VAT return, accounts…"></div><div class="field"><label>Assigned staff (including partners)</label><select id="wstaff">${memberOptions(['staff','manager','partner','managing_partner'])}</select></div><div class="field"><label>Reviewer</label><select id="wreviewer">${memberOptions(['manager','partner','managing_partner'])}</select></div><div class="field"><label>Partner assigned</label><select id="wpartner">${memberOptions(['partner','managing_partner'])}</select></div><div class="field"><label>Delivery date</label><input id="wdelivery" type="date"></div><div class="field"><label>Budgeted hours</label><input id="whours" type="number" min="0" step="0.5"></div><div class="field"><label>Initial status</label><select id="wstatus">${['Not started','Lack of information','In progress','Under review','Completed'].map(s=>`<option>${s}</option>`).join('')}</select></div></div>`,'saveWork()','Add to planner')}
async function saveWork(){try{await api('/api/engagements',{method:'POST',body:JSON.stringify({client_id:document.getElementById('wclient').value,nature:document.getElementById('wnature').value,staff_email:document.getElementById('wstaff').value,reviewer_email:document.getElementById('wreviewer').value,partner_email:document.getElementById('wpartner').value,delivery_date:document.getElementById('wdelivery').value,budget_hours:document.getElementById('whours').value,status:document.getElementById('wstatus').value})});closeModal();await load();go('planner');toast('Engagement added to the shared planner.')}catch(e){toast(e.message)}}
function openKyc(clientId){const c=state.clients.find(x=>x.id===clientId);if(!c)return;selectedClient=c;modal(`${esc(c.legal_name)} · KYC profile`,'Due diligence record and protected client documents.',`<div class="formgrid"><div class="field"><label>Risk rating</label><select id="krisk">${['Not rated','Low','Medium','High'].map(x=>`<option ${c.risk_rating===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Review status</label><select id="kstatus">${['Not started','In progress','Review due','Enhanced review','Complete'].map(x=>`<option ${c.kyc_status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Next review date</label><input id="kdate" type="date" value="${esc(c.review_due||'')}"></div><div class="field"><label>Client risk basis</label><input id="kcategory" value="${esc(c.risk_rating||'Not rated')}" disabled></div><div class="field wide"><label>Review notes</label><textarea id="knote" rows="3" placeholder="Record the review, ownership checks and approval notes…"></textarea></div><div class="field wide"><label>Upload supporting document</label><label class="dropzone" for="kfile"><span class="uploadicon">↑</span><b>Choose a client document</b><span>PDF, JPG, PNG or DOCX · maximum 15 MB</span></label><input id="kfile" type="file" class="hidden" accept=".pdf,.jpg,.jpeg,.png,.docx"><div id="filelist" class="filelist">${(state.documentRows||[]).filter(d=>d.client_id===c.id).map(d=>`<div class="filepill">▧ ${esc(d.filename)}<small><a href="/api/documents/${encodeURIComponent(d.id)}">Download · ${formatBytes(d.byte_size)}</a></small></div>`).join('')}</div></div></div>`,'saveKyc()','Save review')}
function formatBytes(n){n=Number(n||0);return n>1048576?(n/1048576).toFixed(1)+' MB':Math.ceil(n/1024)+' KB'}
async function saveKyc(){try{await api('/api/kyc',{method:'POST',body:JSON.stringify({client_id:selectedClient.id,risk_rating:document.getElementById('krisk').value,status:document.getElementById('kstatus').value,review_due:document.getElementById('kdate').value,notes:document.getElementById('knote').value})});const f=document.getElementById('kfile').files[0];if(f){const fd=new FormData();fd.append('client_id',selectedClient.id);fd.append('file',f);await api('/api/documents',{method:'POST',body:fd})}closeModal();await load();go('compliance');toast('Compliance file updated and recorded.')}catch(e){toast(e.message)}}
function openInvite(){if(state.user.role!=='managing_partner')return;modal('Invite a team member','The invitee must use this email to sign in.',`<div class="formgrid"><div class="field"><label>Full name</label><input id="iname"></div><div class="field"><label>Firm email address</label><input id="iemail" type="email"></div><div class="field wide"><label>Role</label><select id="irole"><option value="staff">Staff</option><option value="manager">Manager</option><option value="partner">Partner</option></select></div></div><div class="risk"><b>Platform access:</b> After creating this invite, add the member’s email to the Site access list. They can then sign in and accept the workspace invitation automatically.</div>`,'saveInvite()','Create invitation')}
async function saveInvite(){try{await api('/api/invites',{method:'POST',body:JSON.stringify({display_name:document.getElementById('iname').value,email:document.getElementById('iemail').value,role:document.getElementById('irole').value})});closeModal();await load();go('team');toast('Invitation saved. Add the email to Site access so they can sign in.')}catch(e){toast(e.message)}}
async function cancelInvite(encoded){try{await api('/api/invites?email='+encoded,{method:'DELETE'});await load();go('team')}catch(e){toast(e.message)}}
function updateProgress(eid){const w=state.work.find(x=>x.id===eid);if(!w)return;modal('Update job progress','Choose the current stage and record the percentage complete.',`<div class="formgrid"><div class="field wide"><label>Progress status</label><select id="pstatus">${['Not started','Lack of information','In progress','Under review','Completed'].map(s=>`<option ${w.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Progress (%)</label><input id="pprogress" type="number" min="0" max="100" value="${Number(w.progress||0)}"></div></div>`,'saveProgress(\''+eid+'\')','Save progress')}
async function saveProgress(eid){try{await api('/api/engagement-status',{method:'PATCH',body:JSON.stringify({id:eid,status:document.getElementById('pstatus').value,progress:document.getElementById('pprogress').value})});closeModal();await load();go('planner')}catch(e){toast(e.message)}}
async function deleteJob(eid){if(!confirm('Delete this job from the active planner? You can restore it from Archived jobs.'))return;try{await api('/api/engagements/'+encodeURIComponent(eid),{method:'DELETE'});await load();go('planner');toast('Job moved to Archived jobs.')}catch(e){toast(e.message)}}
async function restoreJob(eid){try{await api('/api/engagements/'+encodeURIComponent(eid)+'/restore',{method:'POST',body:JSON.stringify({})});await load();go('planner');toast('Job restored to the active planner.')}catch(e){toast(e.message)}}
document.getElementById('globalSearch').value='';load();

</script></body></html>
